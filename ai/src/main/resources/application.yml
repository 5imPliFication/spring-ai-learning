server:
  port: 8080

spring:
  application:
    name: Spring AI Chat
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  ai:
    deepseek:
      api-key: ${AI-API-KEY}
      base-url: https://api.deepseek.com/v1
      chat:
        model: deepseek-v4-flash

app:
  jwt:
    secret: azura-chat-app-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000  # 24 hours

  ai:
    name: Azura
    system-prompt: >
      You are a helpful and friendly AI assistant participating in a group chat.
      When users ask for your opinion or help, give them a direct, honest answer.
    max-tokens: 256
    context-messages: 20
