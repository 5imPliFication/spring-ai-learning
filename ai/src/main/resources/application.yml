server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from Railway's proxy so getRemoteAddr() is the real client IP (used by rate limiting).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: Spring AI Chat
  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    # Railway provides PG* automatically; locally set them in ai/.env (PGSSLMODE=disable for a non-SSL Postgres).
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=${PGSSLMODE:require}
    username: ${PGUSER}
    password: ${PGPASSWORD}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  ai:
    deepseek:
      api-key: ${AI-API-KEY}
      base-url: https://api.deepseek.com/v1
      chat:
        model: deepseek-v4-flash

app:
  jwt:
    secret: ${JWT-SECRET}
    expiration-ms: 604800000  # 1 week

  oauth:
    google:
      client-id: ${OAUTH-CLIENT-ID:}
      client-secret: ${OAUTH-CLIENT-SECRET:}
      redirect-uri: ${OAUTH-REDIRECT-URI:http://localhost:8080/api/v1/oauth/google/callback}
      scopes: openid email https://www.googleapis.com/auth/calendar

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  cors:
    # Comma-separated origins (patterns allowed, e.g. https://*.up.railway.app).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend.base-url}}

  ratelimit:
    ai-per-minute: ${AI_RATE_PER_MINUTE:10}
    ai-per-day: ${AI_RATE_PER_DAY:100}
    auth-per-minute: ${AUTH_RATE_PER_MINUTE:5}

  r2:
    endpoint: ${R2_ENDPOINT}
    region: auto
    access-key: ${R2_ACCESS_KEY_ID}
    secret-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET_NAME}
    public-base-url: ${R2_PUBLIC_BASE_URL}
    upload-expiry-minutes: 15
    max-upload-size-bytes: 26214400  # 25 MB

  ai:
    name: Azura
    system-prompt: >
      You are a helpful and friendly AI assistant participating in a group chat.
      When users ask for your opinion or help, give them a direct, honest answer.
    max-tokens: ${AI_MAX_TOKENS:512}
    context-messages: 20
    streaming:
      # Stream replies token by token over the room topic; false = one message when the reply is complete.
      enabled: ${AI_STREAMING_ENABLED:true}
      timeout: 90s
    # Concurrent AI calls; extra requests queue up to queue-capacity, then get a "busy" reply.
    executor:
      threads: 4
      queue-capacity: 50

  notification:
    ttl-days: 56
    cleanup-cron: "0 15 3 * * *"
